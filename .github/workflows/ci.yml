name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21', '25', '27']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - run: scripts/start-garage.sh
      - name: Build and actual Garage tests
        env:
          S3_TEST_ENDPOINT: http://127.0.0.1:19390
        run: ./gradlew build publishToMavenLocal -Dmaven.repo.local="$PWD/build/local-repository" --no-daemon --max-workers=2
      - name: Compile and run independent package consumer
        run: ./gradlew -p examples/consumer run --no-daemon --max-workers=2
      - name: Retain verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-${{ matrix.java }}-reports
          path: '**/build/reports/tests/**'
      - name: Stop fixture
        if: always()
        run: test ! -f build/garage/container-id || docker rm -f "$(cat build/garage/container-id)"
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: browser/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:package
